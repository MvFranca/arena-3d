# fly.toml — game server Arena
# Deploy: fly deploy
# Região GRU = São Paulo

app = "arena-3d"
primary_region = "gru"

[build]

[env]
  ALLOW_ANON = "true"
  PORT = "8080"
  PUBLIC_WS_URL = "wss://arena-3d.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Não dorme no meio da partida
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  # IMPORTANTE: salas ficam em memória. O Fly cria 2 machines no 1º deploy.
  # Depois do deploy rode: fly scale count 1
  # Com 2+ machines, create numa e join na outra = "Sala não encontrada".

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  # Rapier + Node estouravam 512MB (OOM) e matavam as salas em memória
  memory = "1gb"
  memory_mb = 1024
  cpu_kind = "shared"
  cpus = 1
