# fly.toml — game server Arena
# Deploy: fly deploy
# Região GRU = São Paulo

app = "arena-3d"
primary_region = "gru"

[build]

[env]
  ALLOW_ANON = "true"
  PORT = "8080"
  PUBLIC_WS_URL = "wss://arena-3d.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  # Não dorme no meio da partida
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
