name: Deploy Oracle

on:
  push:
    branches: [main]
    paths:
      - "apps/game-server/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "deploy/oracle/**"
      - ".github/workflows/deploy-oracle.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixa o código
        uses: actions/checkout@v4

      - name: Envia os arquivos para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 152.67.61.207
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "apps/game-server,packages,package.json,pnpm-lock.yaml,pnpm-workspace.yaml,deploy/oracle"
          target: "/home/opc/arena"
          overwrite: true
          strip_components: 0

      - name: Instala e reinicia o game server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 152.67.61.207
          username: opc
          key: ${{ secrets.ORACLE_SSH_KEY }}
          command_timeout: 10m
          script_stop: true
          script: bash /home/opc/arena/deploy/oracle/update.sh
