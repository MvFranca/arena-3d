services:
  game:
    image: arena-game:latest
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8080"
      ALLOW_ANON: "true"
      PUBLIC_WS_URL: "wss://${DOMAIN}"
      NODE_OPTIONS: "--max-old-space-size=384"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
